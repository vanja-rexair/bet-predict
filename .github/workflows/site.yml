# Sajt na GitHub Pages: ista aplikacija kao na telefonu, čita prognoze iz javnog repozitorijuma.
name: Sajt
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', 'engine/src/types.ts', 'engine/src/market.ts', 'package-lock.json', '.github/workflows/site.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm -w web run build
        env:
          VITE_DATA: https://raw.githubusercontent.com/${{ vars.DATA_REPO }}/main
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/dist }
      - id: deploy
        uses: actions/deploy-pages@v4
